<!DOCTYPE html>
<html>
<head>
    <title>W3W Pins Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Map library (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- CSV parser library (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Initialize map
        var map = L.map('map').setView([0, 0], 2);

        // 2. Add tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Load and parse the CSV
        Papa.parse("locations.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                var markers = L.featureGroup();

                results.data.forEach(function(row) {
                    var lat = parseFloat(row.lat);
                    var lng = parseFloat(row.lng);
                    var name = row.name;
                    var w3w = row.w3w;

                    if (!isNaN(lat) && !isNaN(lng)) {
                        // Create marker with popup showing Name + W3W address
                        var marker = L.marker([lat, lng])
                            .bindPopup("<b>" + name + "</b><br>///" + w3w);
                        
                        markers.addLayer(marker);
                    }
                });

                markers.addTo(map);

                // Auto-fit map boundaries to include all markers
                if (markers.getLayers().length > 0) {
                    map.fitBounds(markers.getBounds(), { padding: [30, 30] });
                }
            }
        });
    </script>
</body>
</html>
