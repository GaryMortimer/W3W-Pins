<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My what3words Map</title>
    
    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS & PapaParse CSV Engine -->
    <script src="https://unpkg.com" crossorigin=""></script>
    <script src="https://cloudflare.com"></script>

    <script>
        const CSV_FILE_PATH = 'locations.csv'; 

        // Initialize Map globally zoomed out
        const map = L.map('map').setView([0, 0], 2);

        // Load premium looking minimalist light map tiles
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>'
        }).addTo(map);

        const markerBounds = [];

        // Read and parse your GitHub CSV data
        Papa.parse(CSV_FILE_PATH, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const rows = results.data;
                
                for (const row of rows) {
                    const words = row.w3w; 
                    const label = row.name;
                    const lat = parseFloat(row.lat);
                    const lng = parseFloat(row.lng);

                    // Drop pin if valid numbers exist in the row columns
                    if (!isNaN(lat) && !isNaN(lng)) {
                        const marker = L.marker([lat, lng]).addTo(map);
                        marker.bindPopup(`<b>${label}</b><br><a href="https://what3words.com{words}" target="_blank">///${words}</a>`);
                        
                        markerBounds.push([lat, lng]);
                    }
                }

                // Frame map around your specific coordinates automatically
                if (markerBounds.length > 0) {
                    map.fitBounds(markerBounds, { padding: [50, 50] });
                }
            }
        });
    </script>
</body>
</html>
