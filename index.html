<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My what3words Map</title>
    
    <!-- Leaflet Maps CSS -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #loading {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            font-family: system-ui, sans-serif;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading">Mapping your 25 locations... <span id="progress">0</span>/25</div>
    <div id="map"></div>

    <!-- Leaflet JS & PapaParse CSV Engine -->
    <script src="https://unpkg.com" crossorigin=""></script>
    <script src="https://cloudflare.com"></script>

    <script>
        // Configured with your real API Key
        const W3W_API_KEY = 'T61OT8JM'; 
        const CSV_FILE_PATH = 'locations.csv'; 

        // Initialize Map globally zoomed out
        const map = L.map('map').setView([0, 0], 2);

        // Load premium looking minimalist light map tiles
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>'
        }).addTo(map);

        const markerBounds = [];
        
        // Helper function to introduce a small delay between API calls to prevent rate limiting
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // Read and parse your GitHub CSV data
        Papa.parse(CSV_FILE_PATH, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: async function(results) {
                const rows = results.data;
                let mappedCount = 0;
                
                for (const row of rows) {
                    const words = row.w3w; 
                    const label = row.name;

                    if (words) {
                        try {
                            // Call what3words to translate 3-word combinations to standard lat/long
                            const response = await fetch(`https://what3words.com{words}&key=${W3W_API_KEY}`);
                            const data = await response.json();
                            
                            if (data.coordinates) {
                                const lat = data.coordinates.lat;
                                const lng = data.coordinates.lng;
                                
                                // Place standard Leaflet pointer pin
                                const marker = L.marker([lat, lng]).addTo(map);
                                marker.bindPopup(`<b>${label}</b><br><a href="https://what3words.com{words}" target="_blank">///${words}</a>`);
                                
                                markerBounds.push([lat, lng]);
                            }
                        } catch (error) {
                            console.error(`Failed to map: ${words}`, error);
                        }
                        
                        // Update screen progress tracking metrics
                        mappedCount++;
                        document.getElementById('progress').innerText = mappedCount;
                        
                        // Wait 100 milliseconds before sending the next record
                        await delay(100); 
                    }
                }

                // Clean up screen view overlays & frame map around your specific coordinates
                document.getElementById('loading').style.display = 'none';
                if (markerBounds.length > 0) {
                    map.fitBounds(markerBounds, { padding: [50, 50] });
                }
            }
        });
    </script>
</body>
</html>
